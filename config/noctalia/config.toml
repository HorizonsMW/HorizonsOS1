# ═══════════════════════════════════════════════════════════════════════════
# NOCTALIA — "GOLDEN GATE" THEME
# An iOS 27 / macOS 27 "Liquid Glass" inspired look: frosted translucent
# capsules, tall pill-shaped bar, deep glass-black surfaces, warm gold accent
# with a Golden Gate Bridge international-orange undertone.
#
# Install:
#   1. Copy this file to        ~/.config/noctalia/config.toml
#   2. Copy GoldenGate.json to  ~/.config/noctalia/palettes/GoldenGate.json
#      (color roles must live in a palette file — Noctalia's theme engine
#      does not accept inline palette definitions inside config.toml)
#   3. For real glass blur (not just transparency) enable compositor-side
#      blur for layer-shell surfaces — see docs.noctalia.dev for your
#      compositor (Hyprland: blur + xray off on the noctalia namespace).
# Everything else — bar, control center, dock, panels, notifications, OSD,
# lockscreen, wallpaper — lives in this one file as requested.
# ═══════════════════════════════════════════════════════════════════════════

